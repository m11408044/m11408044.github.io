<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Fancy Hand – m11408044</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a14; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    #container { position: relative; }
    video  { display: none; }
    canvas { border-radius: 16px; box-shadow: 0 0 60px #4400ff55; display: block; }
    #label {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.7); font: 600 14px 'Segoe UI', sans-serif;
      letter-spacing: 2px; text-transform: uppercase; pointer-events: none;
    }
  </style>
</head>
<body>
<div id="container">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="label">Unit08_2 · m11408044 · hand2</div>
</div>

<!-- MediaPipe Hands (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
// ── 21 點彩虹色（HSL 均勻分布）──
const N = 21;
const COLORS = Array.from({ length: N }, (_, i) => {
  const h = Math.round(i * 360 / N);
  return { h, css: `hsl(${h},100%,65%)` };
});

// 連線定義（MediaPipe standard）
const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17],
];

const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

// ── 畫每條連線（兩端顏色漸層）──
function drawConnection(pts, a, b) {
  const p1 = pts[a], p2 = pts[b];
  const grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
  grad.addColorStop(0, COLORS[a].css);
  grad.addColorStop(1, COLORS[b].css);
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.strokeStyle = grad;
  ctx.lineWidth = 2.5;
  ctx.shadowColor = COLORS[a].css;
  ctx.shadowBlur = 10;
  ctx.stroke();
  ctx.shadowBlur = 0;
}

// ── 畫每個點（雙圈 + 光暈）──
function drawPoint(pt, idx) {
  const col = COLORS[idx].css;
  const h = COLORS[idx].h;
  const bright = `hsl(${h},100%,90%)`;

  // 外光暈
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, 14, 0, Math.PI * 2);
  ctx.fillStyle = `hsla(${h},100%,65%,0.15)`;
  ctx.fill();

  // 外圈描邊
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, 9, 0, Math.PI * 2);
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.5;
  ctx.shadowColor = col;
  ctx.shadowBlur = 12;
  ctx.stroke();

  // 中圈細線
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
  ctx.strokeStyle = bright;
  ctx.lineWidth = 1;
  ctx.shadowBlur = 6;
  ctx.stroke();

  // 內芯實心
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = bright;
  ctx.shadowColor = bright;
  ctx.shadowBlur = 8;
  ctx.fill();

  ctx.shadowBlur = 0;
}

// ── MediaPipe Hands ──
const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });

hands.onResults(results => {
  canvas.width  = results.image.width;
  canvas.height = results.image.height;

  // 鏡像繪製畫面
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  if (!results.multiHandLandmarks) return;

  for (const lms of results.multiHandLandmarks) {
    const pts = lms.map(lm => ({
      x: (1 - lm.x) * canvas.width,   // 鏡像 x
      y: lm.y * canvas.height,
    }));

    // 連線
    for (const [a, b] of CONNECTIONS) drawConnection(pts, a, b);
    // 點
    pts.forEach((pt, i) => drawPoint(pt, i));
  }
});

// ── 開攝影機 ──
const camera = new Camera(video, {
  onFrame: async () => { await hands.send({ image: video }); },
  width: 640, height: 420,
});
camera.start();
</script>
</body>
</html>
